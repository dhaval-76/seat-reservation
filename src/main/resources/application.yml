spring:
  application:
    name: seatreservation
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/booking}
    username: ${DATABASE_USERNAME:booking}
    password: ${DATABASE_PASSWORD:booking}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 16
        order_inserts: true
        order_updates: true
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSZ}","level":"%level","logger":"%logger{36}","thread":"%thread","request_id":"%X{requestId:-}","message":"%msg"}%n'

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: db
          show-details: always
  metrics:
    enable:
      all: false
      jvm: true
      booking: true
      process: true
      system: true

booking:
  reservation-strategy: all-or-nothing
  hold-duration-seconds: 300
  hold-cleanup-interval-ms: 30000
  max-seats-per-user-per-show: 4
