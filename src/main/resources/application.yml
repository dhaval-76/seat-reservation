spring:
  application:
    name: seat-reservation
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/booking}
    username: ${DATABASE_USERNAME:booking}
    password: ${DATABASE_PASSWORD:booking}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId:-}] %-5level %logger{36} - %msg%n"

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    enable:
      all: false
      jvm: true
      booking: true
      process: true
      system: true

booking:
  reservation-strategy: all-or-nothing
  hold-duration-seconds: 300
  hold-cleanup-interval-ms: 30000
  max-seats-per-user-per-show: 10
