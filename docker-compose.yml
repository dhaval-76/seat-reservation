services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/booking
      DATABASE_USERNAME: booking
      DATABASE_PASSWORD: booking
      BOOKING_HOLD_DURATION_SECONDS: 10
      BOOKING_HOLD_CLEANUP_INTERVAL_MS: 5000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
