services:
  - type: web
    name: seatreservation
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: booking-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: booking-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: booking-db
          property: password

databases:
  - name: booking-db
    plan: free
    databaseName: booking
    user: booking
